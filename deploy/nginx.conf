# Example reverse proxy. Replace the auth_request block with the authority's
# single sign on (OIDC, SAML, client certificates). The identity header must
# be set by the proxy and never forwarded from the client.
server {
    listen 8443 ssl;
    server_name psl.example.internal;
    ssl_certificate     /etc/nginx/certs/psl.crt;
    ssl_certificate_key /etc/nginx/certs/psl.key;

    location / {
        # strip any client supplied identity header, then set the real one
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Remote-User $remote_user;   # from auth_basic/auth_request/OIDC
        proxy_set_header X-PSL-Role "";
        proxy_set_header X-PSL-Role $psl_role;         # analyst | approver | admin | viewer, from the directory
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_pass http://psl:8070;
    }
}
