# Mirrors every push on main to the Hugging Face Space, so GitHub stays the source of truth and the Space
# redeploys automatically. Set two repository secrets: HF_TOKEN (a write token from huggingface.co/settings/tokens)
# and HF_SPACE (the Space id, for example daria/psl-terminal).
name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
